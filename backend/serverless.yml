# Notification Request System — backend
# Four functions, one table, one queue (+ DLQ). See docs/lambda-function-design.md for the reasoning.
service: noti-request-system
frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'ap-southeast-2'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  logRetentionInDays: 14
  # X-Ray on every function: one trace follows a request API → SQS → worker. HTTP API v2 has no X-Ray
  # integration of its own, so tracing starts at the Lambda.
  tracing:
    lambda: true
  environment:
    TABLE_NAME: !Ref NotificationRequestsTable
    LOG_LEVEL: info
  httpApi:
    # CORS lives here, once. API Gateway answers preflights and stamps every response, including errors.
    cors:
      allowedOrigins:
        - http://localhost:3000
        - ${param:frontendOrigin, 'https://noti-request-system.vercel.app'}
      allowedMethods: [GET, POST, OPTIONS]
      allowedHeaders: [Content-Type]
      exposedResponseHeaders: [Location, X-Request-Id]
      maxAge: 86400

build:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    format: cjs
    exclude: ['@aws-sdk/*'] # provided by the nodejs22.x runtime

functions:
  createNotification:
    handler: src/handlers/http/createNotification/index.handler
    events:
      - httpApi:
          method: POST
          path: /notifications
    environment:
      QUEUE_URL: !Ref NotificationRequestsQueue
    iam:
      role:
        statements:
          - Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:GetItem]
            Resource: !GetAtt NotificationRequestsTable.Arn
          - Effect: Allow
            Action: [sqs:SendMessage]
            Resource: !GetAtt NotificationRequestsQueue.Arn

  listNotifications:
    handler: src/handlers/http/listNotifications/index.handler
    events:
      - httpApi:
          method: GET
          path: /notifications
    iam:
      role:
        statements:
          - Effect: Allow
            Action: [dynamodb:Query]
            Resource:
              - !Join ['', [!GetAtt NotificationRequestsTable.Arn, '/index/byCreatedAt']]
              - !Join ['', [!GetAtt NotificationRequestsTable.Arn, '/index/byUser']]

  getNotification:
    handler: src/handlers/http/getNotification/index.handler
    events:
      - httpApi:
          method: GET
          path: /notifications/{id}
    iam:
      role:
        statements:
          - Effect: Allow
            Action: [dynamodb:GetItem]
            Resource: !GetAtt NotificationRequestsTable.Arn

  processNotifications:
    handler: src/handlers/queue/processNotifications/index.handler
    # Caps how hard the worker can hit the provider: 5 × batch 10 = at most 50 in-flight sends. A burst
    # queues in SQS instead of tripping SES/SNS rate limits and burning attempts.
    reservedConcurrency: 5
    events:
      - sqs:
          arn: !GetAtt NotificationRequestsQueue.Arn
          batchSize: 10
          maximumBatchingWindow: 0
          functionResponseType: ReportBatchItemFailures
    environment:
      MAX_ATTEMPTS: '3'
      SIMULATED_FAILURE_RATE: '0.2'
    iam:
      role:
        statements:
          - Effect: Allow
            Action: [dynamodb:UpdateItem]
            Resource: !GetAtt NotificationRequestsTable.Arn
          - Effect: Allow
            Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
            Resource: !GetAtt NotificationRequestsQueue.Arn

resources:
  Resources:
    NotificationRequestsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: ${self:custom.tableDeletionPolicy.${sls:stage}, 'Delete'}
      Properties:
        TableName: notification-requests-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: id, AttributeType: S }
          - { AttributeName: entityType, AttributeType: S }
          - { AttributeName: createdAt, AttributeType: S }
          - { AttributeName: userId, AttributeType: S }
        KeySchema:
          - { AttributeName: id, KeyType: HASH }
        GlobalSecondaryIndexes:
          - IndexName: byCreatedAt
            KeySchema:
              - { AttributeName: entityType, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          # One user's requests, newest first — GET /notifications?userId=…
          - IndexName: byUser
            KeySchema:
              - { AttributeName: userId, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
        PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
        # Message bodies are PII. KMS (AWS-managed key) puts every decrypt in CloudTrail; a customer-managed
        # key is one more line here (KMSMasterKeyId) once the business owns key policy.
        SSESpecification: { SSEEnabled: true, SSEType: KMS }

    NotificationRequestsDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: notification-requests-dlq-${sls:stage}
        MessageRetentionPeriod: 1209600 # 14 days
        SqsManagedSseEnabled: true

    NotificationRequestsQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: notification-requests-${sls:stage}
        VisibilityTimeout: 60 # ≥ 6× the worker timeout; also the retry delay
        SqsManagedSseEnabled: true
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt NotificationRequestsDLQ.Arn
          maxReceiveCount: 5

    # --- Operations: one topic, three alarms. Subscribe an address with --param="alarmEmail=…". ---
    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: noti-request-system-${sls:stage}-alarms

    AlarmEmailSubscription:
      Type: AWS::SNS::Subscription
      Condition: HasAlarmEmail
      Properties:
        TopicArn: !Ref AlarmTopic
        Protocol: email
        Endpoint: ${param:alarmEmail, ''}

    # A message in the DLQ means the worker crashed on it 5 times: someone has to look.
    DlqNotEmptyAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: noti-request-system-${sls:stage}-dlq-not-empty
        AlarmDescription: Messages are sitting in the notification dead-letter queue
        Namespace: AWS/SQS
        MetricName: ApproximateNumberOfMessagesVisible
        Dimensions:
          - { Name: QueueName, Value: !GetAtt NotificationRequestsDLQ.QueueName }
        Statistic: Maximum
        Period: 60
        EvaluationPeriods: 1
        Threshold: 0
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]
        OKActions: [!Ref AlarmTopic]

    # Unhandled worker errors (not business failures, which are recorded on the item and never throw).
    WorkerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: noti-request-system-${sls:stage}-worker-errors
        AlarmDescription: processNotifications is throwing
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - { Name: FunctionName, Value: !Ref ProcessNotificationsLambdaFunction }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]
        OKActions: [!Ref AlarmTopic]

    # 5xx from the API: our INTERNAL_ERROR / ENQUEUE_FAILED responses or API Gateway itself.
    ApiServerErrorsAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: noti-request-system-${sls:stage}-api-5xx
        AlarmDescription: The notification API is returning 5xx
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - { Name: ApiId, Value: !Ref HttpApi }
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions: [!Ref AlarmTopic]
        OKActions: [!Ref AlarmTopic]

  Conditions:
    HasAlarmEmail: !Not
      - !Equals
        - ${param:alarmEmail, ''}
        - ''

  # The framework owns the HTTP API stage; add a default throttle so an open, unauthenticated POST cannot
  # be hammered. Per-route or per-client limits are an authorizer + usage-plan question, not this.
  extensions:
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10

  Outputs:
    # HttpApiUrl is emitted by the framework itself.
    TableName:
      Value: !Ref NotificationRequestsTable
    QueueUrl:
      Value: !Ref NotificationRequestsQueue
    AlarmTopicArn:
      Value: !Ref AlarmTopic

custom:
  tableDeletionPolicy:
    prod: Retain
