# ElasticMQ (SQS-compatible) queues for local development.
# Mirrors the queue resources in backend/serverless.yml.
include classpath("application.conf")

node-address {
  protocol = http
  host     = localhost
  port     = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  notification-requests-dlq {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
  notification-requests {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "notification-requests-dlq"
      maxReceiveCount = 5
    }
  }
}
